name: lombardia-socrata-coverage

on:
  pull_request:
    paths:
      - "scripts/measure_lombardia_socrata_structured_coverage.py"
      - "docs/PHASE_R_LOMBARDIA_SOCRATA_CLASSIFICATION_GATE.md"
      - ".github/workflows/lombardia-socrata-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggregate-coverage-measurement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e ".[dev]"
      - name: Measure safe Lombardia structured coverage
        run: python scripts/measure_lombardia_socrata_structured_coverage.py
      - name: Upload aggregate coverage result
        uses: actions/upload-artifact@v4
        with:
          name: lombardia-socrata-structured-coverage
          path: artifacts/lombardia-socrata-structured-coverage.json
          if-no-files-found: error
