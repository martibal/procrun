name: openbdap-mop-odata-projection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Inspect MOP gare OData schema only
        run: |
          mkdir -p artifacts
          python scripts/qualify_openbdap_mop_gare_projection.py > artifacts/openbdap-mop-gare-schema.json
      - name: Upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: openbdap-mop-gare-schema
          path: artifacts/openbdap-mop-gare-schema.json
          if-no-files-found: error
          retention-days: 30
