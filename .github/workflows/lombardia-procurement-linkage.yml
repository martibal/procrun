name: lombardia-procurement-linkage

on:
  pull_request:
    paths:
      - "scripts/measure_lombardia_procurement_linkage.py"
      - ".github/workflows/lombardia-procurement-linkage.yml"
      - "docs/PHASE_R_LOMBARDIA_PROCUREMENT_LINKAGE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-linkage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Measure direct CUP procurement linkage
        run: python scripts/measure_lombardia_procurement_linkage.py
      - name: Upload aggregate linkage report
        uses: actions/upload-artifact@v4
        with:
          name: lombardia-procurement-linkage
          path: artifacts/lombardia-procurement-linkage.json
          if-no-files-found: error
          retention-days: 90
