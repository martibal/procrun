name: engine-v2-final-holdout-freeze

on:
  workflow_dispatch:

jobs:
  freeze-source-only-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e '.[dev]'
      - name: Build sanctioned sanitized source pool
        run: python scripts/build_a21a_sanitized_source_pool.py --output artifacts/a21a-sanitized-source-pool.json
      - name: Validate sanctioned source pool
        run: python scripts/validate_a21a_sanitized_source_pool.py --input artifacts/a21a-sanitized-source-pool.json --output artifacts/a21a-sanitized-source-ingress-report.json
      - name: Rebuild frozen development sample for exclusion only
        run: python scripts/build_engine_v2_blind_sample.py --input artifacts/a21a-sanitized-source-pool.json --output artifacts/engine-v2-blind-development-sample.json --size 200
      - name: Freeze source-only disjoint final holdout
        run: python scripts/build_engine_v2_final_holdout.py --source-pool artifacts/a21a-sanitized-source-pool.json --development-sample artifacts/engine-v2-blind-development-sample.json --output artifacts/engine-v2-final-holdout-source-only.json --size 400
      - uses: actions/upload-artifact@v4
        with:
          name: engine-v2-final-holdout-source-only
          path: |
            artifacts/a21a-sanitized-source-ingress-report.json
            artifacts/engine-v2-final-holdout-source-only.json
          retention-days: 30
