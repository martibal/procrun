name: openbdap-mop-prospective-freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Freeze identity-free 12m MOP cohort
        run: python scripts/freeze_openbdap_mop_prospective_cohort.py
      - name: Upload frozen prospective cohort
        uses: actions/upload-artifact@v4
        with:
          name: openbdap-mop-prospective-2026-08-31
          path: artifacts/openbdap-mop-prospective-2026-08-31
          if-no-files-found: error
          retention-days: 90
