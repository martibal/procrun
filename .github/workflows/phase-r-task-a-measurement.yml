name: phase-r-task-a-measurement

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/procrun/component_engine.py'
      - 'src/procrun/component_engine_phrase.py'
      - 'src/procrun/eu_objective_mapping.py'
      - 'scripts/measure_phase_r_task_a.py'
      - 'docs/PHASE_R_PREREGISTRATION.md'
      - 'docs/EU_OBJECTIVE_CODE_MAPPING.md'

permissions:
  contents: read

jobs:
  measure-task-a:
    if: github.head_ref == 'phase-r/task-a-b'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Measure Task A on frozen full corpus
        run: python scripts/measure_phase_r_task_a.py
      - name: Upload isolated Task A report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-r-task-a-report
          path: artifacts/phase-r-task-a-report.json
          if-no-files-found: error
