name: a21a-title-objective-blind-review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_a21a_title_objective_blind_review_sample.py"
      - "tests/fixtures/a21a_title_utility_development_review_v1.json"
      - ".github/workflows/a21a-title-objective-blind-review.yml"

permissions:
  contents: read

jobs:
  build-blind-review-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e ".[dev]"
      - name: Build source-only title-objective blind review sample
        run: |
          python scripts/build_a21a_title_objective_blind_review_sample.py \
            --review tests/fixtures/a21a_title_utility_development_review_v1.json \
            --output artifacts/a21a_title_objective_blind_review_sample.json
      - name: Upload source-only blind review sample
        uses: actions/upload-artifact@v4
        with:
          name: a21a-title-objective-blind-review-sample
          path: artifacts/a21a_title_objective_blind_review_sample.json
          if-no-files-found: error
          retention-days: 7
