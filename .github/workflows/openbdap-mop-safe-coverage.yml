name: openbdap-mop-safe-coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Measure identity-free national MOP runway
        run: |
          mkdir -p artifacts
          python scripts/measure_openbdap_mop_runway.py > artifacts/openbdap-mop-runway.json
      - name: Upload aggregate runway report
        uses: actions/upload-artifact@v4
        with:
          name: openbdap-mop-runway
          path: artifacts/openbdap-mop-runway.json
          if-no-files-found: error
          retention-days: 30
