name: a21a-lombardia-socrata-projection

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/probe_a21a_lombardia_socrata_projection.py"
      - "tests/test_a21a_lombardia_socrata_projection.py"
      - ".github/workflows/a21a-lombardia-socrata-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run projection unit tests
        run: pytest -q tests/test_a21a_lombardia_socrata_projection.py
      - name: Run one-row zero-PII projection proof
        run: python scripts/probe_a21a_lombardia_socrata_projection.py
