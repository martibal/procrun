name: infrastructure-closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infrastructure-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-own-code-proof:
    if: github.head_ref == 'release/infrastructure-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: procrun_closure
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procrun_closure"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PROCRUN_CLOSURE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/procrun_closure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -c requirements-runtime.lock -e '.[dev]'
      - name: Run complete live own-code proof
        run: >-
          python scripts/run_infrastructure_closure.py
          --database-url "$PROCRUN_CLOSURE_DATABASE_URL"
          --report artifacts/infrastructure-closure-v1.json
          --jsonl artifacts/customer-runway.jsonl
      - name: Publish proof report only
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-closure-proof
          path: artifacts/infrastructure-closure-v1.json
          if-no-files-found: error
          retention-days: 90
