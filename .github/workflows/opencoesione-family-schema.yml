name: opencoesione-family-schema

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/qualify_opencoesione_family_schema.py"
      - ".github/workflows/opencoesione-family-schema.yml"
      - "src/procrun/collectors/opencoesione.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install project and workbook reader
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check "xlrd==2.0.2"
      - name: Qualify official metadata only
        run: python scripts/qualify_opencoesione_family_schema.py
