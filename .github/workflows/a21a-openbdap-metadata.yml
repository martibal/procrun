name: a21a-openbdap-metadata

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/probe_a21a_openbdap_metadata.py"
      - "tests/test_a21a_openbdap_metadata_probe.py"
      - ".github/workflows/a21a-openbdap-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-utility-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          pytest -q tests/test_a21a_openbdap_metadata_probe.py
      - name: Run metadata-only remote qualification
        run: python scripts/probe_a21a_openbdap_metadata.py
