name: lombardia-frozen-action-distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Measure frozen action distribution
        run: python scripts/measure_frozen_action_distribution.py
      - name: Upload aggregate action report
        uses: actions/upload-artifact@v4
        with:
          name: lombardia-frozen-action-distribution
          path: artifacts/lombardia-frozen-action-distribution.json
          if-no-files-found: error
          retention-days: 90
