name: a21-materialize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a21-materialize.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .

      - name: Export approved raw FundingProject universe
        run: |
          mkdir -p artifacts/a21
          python scripts/export_a21_project_universe.py \
            --output artifacts/a21/funding-project-universe.jsonl \
            | tee artifacts/a21/universe-summary.txt

      - name: Freeze deterministic benchmark selection
        run: |
          python scripts/prepare_a21_gold.py prepare \
            --projects-jsonl artifacts/a21/funding-project-universe.jsonl \
            --cutoff 2026-09-09 \
            --seed a21-round-001 \
            --manifest artifacts/a21/benchmark-manifest.json \
            --template artifacts/a21/gold-working-template.json \
            --size 200 \
            | tee artifacts/a21/benchmark-summary.txt

      - name: Upload A21 blind benchmark package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a21-round-001-blind-benchmark
          path: artifacts/a21/
          if-no-files-found: error
          retention-days: 90
