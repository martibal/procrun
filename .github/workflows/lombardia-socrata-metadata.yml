name: lombardia-socrata-metadata

on:
  pull_request:
    paths:
      - "scripts/probe_lombardia_socrata_metadata.py"
      - "docs/PHASE_R_LOMBARDIA_SOCRATA_CLASSIFICATION_GATE.md"
      - ".github/workflows/lombardia-socrata-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Probe Regione Lombardia Socrata metadata only
        run: |
          mkdir -p artifacts
          python scripts/probe_lombardia_socrata_metadata.py \
            > artifacts/lombardia-socrata-metadata.json
      - name: Upload metadata-only result
        uses: actions/upload-artifact@v4
        with:
          name: lombardia-socrata-metadata
          path: artifacts/lombardia-socrata-metadata.json
          if-no-files-found: error
