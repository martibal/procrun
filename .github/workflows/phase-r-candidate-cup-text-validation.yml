name: phase-r-candidate-cup-text-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/measure_phase_r_candidate_cup_text_ted.py"
      - "docs/PHASE_R_CANDIDATE_CUP_TEXT_TED_VALIDATION.md"
      - ".github/workflows/phase-r-candidate-cup-text-validation.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e ".[dev]"
      - name: Validate exact CUP text plus candidate CPV against complete TED Italy universe
        env:
          PYTHONPATH: .
        run: python scripts/measure_phase_r_candidate_cup_text_ted.py
      - name: Upload aggregate diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase-r-candidate-cup-text-ted-validation
          path: artifacts/phase-r-candidate-cup-text-ted-validation.json
          retention-days: 90
