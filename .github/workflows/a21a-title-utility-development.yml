name: a21a-title-utility-development

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_a21a_title_utility_development_review.py"
      - "tests/fixtures/a21a_title_utility_development_review_v1.json"
      - ".github/workflows/a21a-title-utility-development.yml"

permissions:
  contents: read

jobs:
  review-title-utility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e ".[dev]"
      - name: Reproduce frozen sample and report aggregate title utility
        run: |
          python scripts/run_a21a_title_utility_development_review.py \
            --review tests/fixtures/a21a_title_utility_development_review_v1.json
