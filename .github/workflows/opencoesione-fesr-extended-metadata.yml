name: opencoesione-fesr-extended-metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-extended-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Probe exact metadata workbook only
        run: |
          mkdir -p artifacts
          python scripts/probe_opencoesione_fesr_extended_metadata.py > artifacts/opencoesione-fesr-extended-metadata.json
      - name: Upload schema-only result
        uses: actions/upload-artifact@v4
        with:
          name: opencoesione-fesr-extended-metadata
          path: artifacts/opencoesione-fesr-extended-metadata.json
          if-no-files-found: error
          retention-days: 30
