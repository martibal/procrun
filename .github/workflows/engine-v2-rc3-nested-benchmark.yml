name: engine-v2-rc3-nested-benchmark

on:
  workflow_dispatch:

jobs:
  nested-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python and local retrieval runtime
        run: python -m pip install -c requirements-runtime.lock -e '.[dev,retrieval]'
      - name: Build sanctioned sanitized source pool
        run: python scripts/build_a21a_sanitized_source_pool.py --output artifacts/a21a-sanitized-source-pool.json
      - name: Validate sanctioned source pool
        run: python scripts/validate_a21a_sanitized_source_pool.py --input artifacts/a21a-sanitized-source-pool.json --output artifacts/a21a-sanitized-source-ingress-report.json
      - name: Rebuild RC1 development
        run: python scripts/build_engine_v2_blind_sample.py --input artifacts/a21a-sanitized-source-pool.json --output artifacts/engine-v2-blind-development-sample.json --size 200
      - name: Rebuild RC1 holdout
        run: python scripts/build_engine_v2_final_holdout.py --source-pool artifacts/a21a-sanitized-source-pool.json --development-sample artifacts/engine-v2-blind-development-sample.json --output artifacts/engine-v2-final-holdout-source-only.json --size 400
      - name: Rebuild RC2 development
        run: python scripts/build_engine_v2_rc2_development.py --source-pool artifacts/a21a-sanitized-source-pool.json --rc1-development artifacts/engine-v2-blind-development-sample.json --rc1-holdout artifacts/engine-v2-final-holdout-source-only.json --output artifacts/engine-v2-rc2-development-source-only.json --size 800
      - name: Rebuild RC2 final holdout
        run: python scripts/build_engine_v2_rc2_final_holdout.py --source-pool artifacts/a21a-sanitized-source-pool.json --rc1-development artifacts/engine-v2-blind-development-sample.json --rc1-holdout artifacts/engine-v2-final-holdout-source-only.json --rc2-development artifacts/engine-v2-rc2-development-source-only.json --candidate data/engine_v2/rc2_candidate_v1.json --output artifacts/engine-v2-rc2-final-holdout-source-only.json --size 800
      - name: Build RC3 consumed development population
        run: python scripts/build_engine_v2_rc3_development.py --rc1-development artifacts/engine-v2-blind-development-sample.json --rc1-holdout artifacts/engine-v2-final-holdout-source-only.json --rc2-development artifacts/engine-v2-rc2-development-source-only.json --rc2-holdout artifacts/engine-v2-rc2-final-holdout-source-only.json --output artifacts/engine-v2-rc3-development-source-only.json
      - name: Build RC3 source-only labels
        run: python scripts/adjudicate_engine_v2_rc3_development.py --input artifacts/engine-v2-rc3-development-source-only.json --output artifacts/engine-v2-rc3-development-labels.json
      - name: Run nested RC3 benchmark
        run: python scripts/benchmark_engine_v2_rc3_nested.py --sample artifacts/engine-v2-rc3-development-source-only.json --labels artifacts/engine-v2-rc3-development-labels.json --output artifacts/engine-v2-rc3-nested-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine-v2-rc3-nested-benchmark
          path: |
            artifacts/a21a-sanitized-source-ingress-report.json
            artifacts/engine-v2-rc3-development-labels.json
            artifacts/engine-v2-rc3-nested-benchmark.json
          retention-days: 30
