name: phase-r-structured-coverage-profile

on:
  pull_request:
    paths:
      - "scripts/measure_phase_r_structured_coverage.py"
      - ".github/workflows/phase-r-structured-coverage-profile.yml"
      - "docs/PHASE_R_STRUCTURED_COVERAGE_EXPANSION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-structured-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Profile structured coverage on frozen corpus
        run: python scripts/measure_phase_r_structured_coverage.py
      - name: Upload aggregate structured coverage report
        uses: actions/upload-artifact@v4
        with:
          name: phase-r-structured-coverage-profile
          path: artifacts/phase-r-structured-coverage-profile.json
          if-no-files-found: error
          retention-days: 90
