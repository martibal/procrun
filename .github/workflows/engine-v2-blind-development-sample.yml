name: engine-v2-clean-development-benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/procrun/evidence_retrieval_v2.py'
      - 'scripts/build_engine_v2_blind_sample.py'
      - 'scripts/benchmark_engine_v2_relevance_gate.py'
      - 'data/engine_v2/clean_dev_labels_v1.json'
      - 'pyproject.toml'
      - '.github/workflows/engine-v2-blind-development-sample.yml'
  workflow_dispatch:

jobs:
  clean-dev-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python and local retrieval runtime
        run: python -m pip install -c requirements-runtime.lock -e '.[dev,retrieval]'
      - name: Build sanctioned sanitized source pool
        run: python scripts/build_a21a_sanitized_source_pool.py --output artifacts/a21a-sanitized-source-pool.json
      - name: Validate source pool
        run: python scripts/validate_a21a_sanitized_source_pool.py --input artifacts/a21a-sanitized-source-pool.json --output artifacts/a21a-sanitized-source-ingress-report.json
      - name: Rebuild frozen blind development sample
        run: python scripts/build_engine_v2_blind_sample.py --input artifacts/a21a-sanitized-source-pool.json --output artifacts/engine-v2-blind-development-sample.json --size 200
      - name: Run Engine V2 supervised relevance gate OOF benchmark
        run: python scripts/benchmark_engine_v2_relevance_gate.py --sample artifacts/engine-v2-blind-development-sample.json --labels data/engine_v2/clean_dev_labels_v1.json --output artifacts/engine-v2-relevance-gate-oof.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine-v2-clean-development-benchmark
          path: |
            artifacts/a21a-sanitized-source-ingress-report.json
            artifacts/engine-v2-relevance-gate-oof.json
          retention-days: 30
