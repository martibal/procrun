name: lombardia-socrata-projection

on:
  pull_request:
    paths:
      - "scripts/probe_lombardia_socrata_projection.py"
      - "docs/PHASE_R_LOMBARDIA_SOCRATA_CLASSIFICATION_GATE.md"
      - ".github/workflows/lombardia-socrata-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-row-projection-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run bounded Socrata projection control
        run: |
          mkdir -p artifacts
          python scripts/probe_lombardia_socrata_projection.py \
            > artifacts/lombardia-socrata-projection.json
      - name: Upload projection result
        uses: actions/upload-artifact@v4
        with:
          name: lombardia-socrata-projection
          path: artifacts/lombardia-socrata-projection.json
          if-no-files-found: error
