name: kohesio-structured-classification-metadata

on:
  pull_request:
    paths:
      - "scripts/probe_kohesio_structured_classification_metadata.py"
      - ".github/workflows/kohesio-structured-classification-metadata.yml"
      - "docs/PHASE_R_KOHESIO_STRUCTURED_CLASSIFICATION_GATE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Probe EUKG property metadata only
        run: |
          mkdir -p artifacts
          python scripts/probe_kohesio_structured_classification_metadata.py > artifacts/kohesio-structured-classification-metadata.json
      - name: Upload metadata-only result
        uses: actions/upload-artifact@v4
        with:
          name: kohesio-structured-classification-metadata
          path: artifacts/kohesio-structured-classification-metadata.json
          if-no-files-found: error
          retention-days: 90
