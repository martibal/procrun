name: opencoesione-cross-runner-probe

on:
  push:
    branches:
      - delivery/opencoesione-cross-runner-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Probe exact approved route
        run: python scripts/probe_opencoesione_transport.py
