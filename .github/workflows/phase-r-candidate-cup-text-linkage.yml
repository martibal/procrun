name: phase-r-candidate-cup-text-linkage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/measure_phase_r_candidate_cup_text_linkage.py"
      - "docs/PHASE_R_CANDIDATE_CUP_TEXT_LINKAGE.md"
      - ".github/workflows/phase-r-candidate-cup-text-linkage.yml"
      - "src/procrun/phase_r_candidate_component_design.py"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e ".[dev]"
      - name: Measure exact CUP text linkage
        run: python scripts/measure_phase_r_candidate_cup_text_linkage.py
      - name: Upload aggregate diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase-r-candidate-cup-text-linkage
          path: artifacts/phase-r-candidate-cup-text-linkage.json
          retention-days: 90
