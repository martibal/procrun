name: phase-r-task-d-measurement

on:
  pull_request:
    paths:
      - "src/procrun/italian_normalization.py"
      - "src/procrun/phase_r_morphology.py"
      - "scripts/measure_phase_r_task_d.py"
      - "tests/test_phase_r_task_d.py"
      - "docs/PHASE_R_TASK_C_RESULT.md"
      - ".github/workflows/phase-r-task-d-measurement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-task-d:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Measure Task D on frozen corpus
        run: python scripts/measure_phase_r_task_d.py
      - name: Upload isolated Task D report
        uses: actions/upload-artifact@v4
        with:
          name: phase-r-task-d-report
          path: artifacts/phase-r-task-d-report.json
          if-no-files-found: error
          retention-days: 90
