name: anac-cig-metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Probe ANAC CIG package metadata only
        run: |
          mkdir -p artifacts
          python scripts/probe_anac_cig_metadata.py > artifacts/anac-cig-metadata.json
      - name: Upload metadata-only result
        uses: actions/upload-artifact@v4
        with:
          name: anac-cig-metadata
          path: artifacts/anac-cig-metadata.json
          if-no-files-found: error
          retention-days: 30
