name: a21a-existing-context-fallback-probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/procrun/a21a_fallback_context.py"
      - "scripts/run_a21a_existing_context_fallback_probe.py"
      - "tests/test_a21a_fallback_context.py"
      - "tests/fixtures/a21a_title_utility_development_review_v1.json"
      - ".github/workflows/a21a-existing-context-fallback-probe.yml"

permissions:
  contents: read

jobs:
  probe-existing-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e ".[dev]"
      - name: Probe already-admitted context for weak-title cases
        run: |
          python scripts/run_a21a_existing_context_fallback_probe.py \
            --review tests/fixtures/a21a_title_utility_development_review_v1.json
