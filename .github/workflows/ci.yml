name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: procrun_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procrun_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PROCRUN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/procrun_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw $_.FullName)) | Out-Null
          }
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/procrun
      - name: Tests
        run: pytest
