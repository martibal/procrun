name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: procrun_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procrun_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PROCRUN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/procrun_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e ".[dev]"
      - name: Compliance gate
        run: |
          python scripts/check_compliance_gate.py --dependencies
          python scripts/check_compliance_gate.py --service github_development
      - name: Permanent no-contact path audit
        run: python scripts/audit_no_contact_paths.py
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw $_.FullName)) | Out-Null
          }
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/procrun
      - name: Python tests
        run: pytest
      - name: TED foundation total qualification
        if: github.event_name == 'pull_request' && github.head_ref == 'research/ted-foundation-total-test'
        run: python scripts/qualify_ted_foundation.py

  opencoesione-all-program-header:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/opencoesione-italy-coverage'
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Verify complete-list frozen header with bounded HTTP Range only
        run: |
          python scripts/probe_opencoesione_headers.py \
            'https://opencoesione.gov.it/it/opendata/beneficiari/2021-2027/beneficiari_2021-2027.zip' \
            --require-frozen-header

  opencoesione-puglia-header:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/opencoesione-italy-coverage'
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Verify Puglia frozen header with bounded HTTP Range only
        run: |
          python scripts/probe_opencoesione_headers.py \
            'https://opencoesione.gov.it/it/opendata/beneficiari/2021-2027/beneficiari_PR_FESR_FSE%2B_PUGLIA.zip' \
            --require-frozen-header

  ted-live-contract:
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Validate current Italy TED query against safe projection
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from procrun.collectors.ted import collect_ted_notices
          from procrun.production_delivery import ted_italy_query

          cutoff = datetime.now(timezone.utc).date()
          result = collect_ted_notices(
              ted_italy_query(cutoff),
              page_size=1,
              max_pages=1,
              scope="ALL",
          )
          if result.total_notice_count is None or result.total_notice_count < 1:
              raise SystemExit("Italy TED production query returned no count")
          if len(result.records) != 1:
              raise SystemExit("Italy TED production query did not return the projected probe row")
          print(f"ted_italy_total_notice_count={result.total_notice_count}")
          print(f"query_cutoff={cutoff.isoformat()}")
          PY

  web:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo "Web CI is frozen until A20 pre-web delivery readiness is green."
