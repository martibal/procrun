name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: procrun_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procrun_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PROCRUN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/procrun_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python
        run: python -m pip install -c requirements-runtime.lock -e ".[dev]"
      - name: Compliance gate
        run: |
          python scripts/check_compliance_gate.py --dependencies
          python scripts/check_compliance_gate.py --service github_development
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw $_.FullName)) | Out-Null
          }
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/procrun
      - name: Python tests
        run: pytest
      - name: OpenCoesione live source-transfer acceptance
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from procrun.collectors.opencoesione import collect_open_coesione
          batch = collect_open_coesione()
          print(f"accepted_operations={len(batch.operations)}")
          print(f"list_updated_on={batch.list_updated_on.isoformat()}")
          print(f"source_sha256={batch.source_sha256}")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install web
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Web typecheck
        working-directory: web
        run: npm run typecheck
      - name: Web production build
        working-directory: web
        run: npm run build
      - name: TED foundation total qualification
        if: github.event_name == 'pull_request' && github.head_ref == 'research/ted-foundation-total-test'
        run: python scripts/qualify_ted_foundation.py
