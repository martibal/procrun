name: ted-mop-safe-linkage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -c requirements-runtime.lock -e .
      - name: Qualify zero-free-text TED CUP linkage
        run: |
          mkdir -p artifacts
          python scripts/qualify_ted_mop_safe_linkage.py
      - name: Upload aggregate qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ted-mop-safe-linkage-qualification
          path: artifacts/ted-mop-safe-linkage-qualification.json
          if-no-files-found: warn
          retention-days: 30
