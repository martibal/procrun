services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: procrun
      POSTGRES_USER: procrun
      POSTGRES_PASSWORD: procrun-local-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procrun -d procrun"]
      interval: 2s
      timeout: 3s
      retries: 20
